name: Auto Update Configs

on:
  schedule:
    # Запуск каждые 6 часов (можете изменить под себя, например '0 */4 * * *' — каждые 4 часа)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Позволяет запускать обновление вручную из вкладки Actions

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run parser script
        run: python update_configs.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Проверяем, были ли изменения в файле
          git add configs.json
          
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update configs: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
